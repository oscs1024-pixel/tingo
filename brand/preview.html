<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Tingo 听过 · Logo</title>
<style>
:root{--ink:#0E1430}
body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#FAFAFC;color:#0a0a0a}
.wrap{max-width:1080px;margin:0 auto;padding:48px 32px}
h1{font-size:15px;font-weight:500;color:#7d8187;letter-spacing:.04em;margin:0 0 28px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.card{border-radius:24px;padding:44px;display:flex;align-items:center;gap:28px;border:1px solid #E9E9ED;background:#fff}
.card.dark{background:#0B0F22;border-color:#0B0F22;color:#fff}
.mark{width:120px;height:120px;flex:none}
.wm{display:flex;flex-direction:column;gap:6px}
.en{font-family:"SF Pro Rounded","SF Pro Display",-apple-system,sans-serif;font-weight:700;font-size:64px;letter-spacing:-.035em;line-height:1}
.en i{font-style:normal;position:relative}
.en .dot{color:#1F4BFF}
.dark .en .dot{color:#34C6F4}
.zh{font-size:22px;font-weight:600;letter-spacing:.32em;color:#7d8187}
.dark .zh{color:#9aa3bf}
.tag{font-size:14px;color:#7d8187;margin-top:6px}
.sizes{display:flex;align-items:flex-end;gap:28px;padding:36px 44px}
.sizes img{display:block}
.sizes span{font-size:12px;color:#a3a7ad;display:block;text-align:center;margin-top:8px}
.dock{background:linear-gradient(135deg,#c9d6ff,#e0f4ff 50%,#ffe9f0);border-radius:24px;padding:40px;display:flex;justify-content:center;gap:22px}
.dock img{width:84px;height:84px;filter:drop-shadow(0 10px 18px rgba(16,24,40,.25))}
.hero{border-radius:24px;padding:64px;background:radial-gradient(60% 80% at 20% 10%,#2b4dff55,transparent),radial-gradient(60% 80% at 90% 100%,#34c6f455,transparent),#0B0F22;color:#fff;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.hero .en{font-size:84px}
.hero p{margin:0;font-size:18px;color:#c3cae0}
</style></head><body><div class="wrap">
<h1>TINGO · 听过 —— LOGO 方案</h1>
<div class="row">
  <div class="card"><img class="mark" src="tingo-icon.svg"><div class="wm"><div class="en">tingo<span class="dot">.</span></div><div class="zh">听过</div></div></div>
  <div class="card dark"><img class="mark" src="tingo-icon.svg"><div class="wm"><div class="en">tingo<span class="dot">.</span></div><div class="zh">听过</div></div></div>
</div>
<div class="row">
  <div class="card sizes"><div><img src="tingo-icon.svg" width="128"><span>128</span></div><div><img src="tingo-icon.svg" width="64"><span>64</span></div><div><img src="tingo-icon.svg" width="32"><span>32</span></div><div><img src="tingo-icon.svg" width="16"><span>16</span></div></div>
  <div class="dock"><img src="tingo-icon.svg"></div>
</div>
<div class="hero"><img src="tingo-icon.svg" width="132"><div class="en">tingo<span class="dot" style="color:#34C6F4">.</span></div><p>开过的会，都听过。本地转写 · 每条结论都对得上原话</p></div>
</div></body></html>
