[package]
name = "jiyao-engine"
version = "0.1.0"
description = "纪要的核心：识别、说话人区分、会议存储、纪要生成"
authors = ["stardust <642720202@qq.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[dependencies]
faer = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["static"] }
