[package]
name = "tingo"
version = "0.4.2"
description = "纪要：本地中文会议录音、转写与纪要"
authors = ["stardust <642720202@qq.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tingo-engine = { version = "0.4.2", path = "../engine" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
