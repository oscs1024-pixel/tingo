<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7FF"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.16" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#3D63FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3D63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.9" cy="0.94" r="0.6">
      <stop offset="0" stop-color="#34C6F4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34C6F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F4BFF"/>
      <stop offset="1" stop-color="#2AA8F0"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CD6FF"/>
      <stop offset="1" stop-color="#1F8CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1B2A6B" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowBlue)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowCyan)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#1B2A6B" stroke-opacity="0.08" stroke-width="3"/>
  <!-- 「 」：引用原话 -->
  <g fill="none" stroke="#0E1430" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M418 290 H312 V522"/>
    <path d="M606 734 H712 V502"/>
  </g>
  <!-- 声波：听 -->
  <g fill="url(#wave)">
    <rect x="365" y="466" width="42" height="92" rx="21" opacity="0.75"/>
    <rect x="428" y="407" width="42" height="210" rx="21"/>
    <rect x="491" y="347" width="42" height="330" rx="21" fill="url(#peak)"/>
    <rect x="554" y="424" width="42" height="176" rx="21"/>
    <rect x="617" y="474" width="42" height="76" rx="21" opacity="0.75"/>
  </g>
</svg>
